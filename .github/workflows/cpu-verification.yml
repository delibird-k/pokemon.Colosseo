name: CPU battle verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.external = any(k == "src" for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      if not self.external and "".join(self.current).strip():
                          self.parts.append("".join(self.current))
                      self.in_script = False
          p = Scripts()
          p.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/colosseo-scripts").mkdir(exist_ok=True)
          for i, source in enumerate(p.parts):
              Path(f"/tmp/colosseo-scripts/{i}.js").write_text(source, encoding="utf-8")
          print(f"Checking {len(p.parts)} inline scripts")
          PY
          for f in /tmp/colosseo-scripts/*.js; do node --check "$f"; done
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real battle simulations
        run: |
          python3 -m http.server 4173 >/tmp/colosseo-http.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Local game server is ready."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Local game server failed to start."
              cat /tmp/colosseo-http.log
              exit 1
            fi
            sleep 1
          done
          node .github/scripts/verify-cpu.mjs
          test_status=$?
          kill "$server_pid" 2>/dev/null || true
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-battle-verification
          path: cpu-verification-results.json
          if-no-files-found: ignore
