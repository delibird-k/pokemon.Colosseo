<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Colosseo</title>
<meta name="theme-color" content="#111827">
<style>:root{color-scheme:light;--bg:#55b99b;--panel:#a9eee0;--line:#178d7b;--text:#087d6d;--muted:#4f7f7d;--gold:#f4d66b;--red:#f08080;--blue:#5d62e8;--green:#009a7b}
*{box-sizing:border-box}body{margin:0;background:#55b99b;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh;padding:8px}
main{width:min(1080px,100%);height:min(720px,calc(100vh - 16px));min-height:610px;margin:auto;background:radial-gradient(ellipse at center,#d1fff3 0,#9cebe0 60%,#73d8ca 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #289f8b}
.brand{height:30px;flex-shrink:0;background:#008e74;color:#fff;margin:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}.brand .eyebrow{font-size:.7rem;letter-spacing:.08em;color:#d5fff4}.brand h1{font-size:1rem;letter-spacing:.03em;margin:0;color:white}.brand p{display:none}
.panel{position:relative;flex:1;min-height:0;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;display:flex;flex-direction:column}
.stats{position:absolute;top:8px;right:10px;display:flex;gap:6px;margin:0;z-index:2}.stat{background:#f0eeee;border:1px solid #b6b6b6;border-radius:20px;padding:5px 10px;text-align:center;display:flex;align-items:center;gap:5px}.stat small{font-size:.68rem;color:#607d88}.stat strong{font-size:.9rem;color:#4b6574}
.arena{position:absolute;inset:0;display:block;pointer-events:none}.fighter{position:absolute;width:32%;height:48px;background:#f0eeee;border:1px solid #aaa;border-radius:24px 0 0 24px;padding:6px 10px 6px 35px;display:flex;align-items:center;gap:8px;pointer-events:auto}.fighter:first-child{top:14%;right:5.5%}.fighter:last-child{top:34%;right:5%;width:32%;min-height:76px;height:auto;padding:8px 12px 8px 22px;border-radius:18px 0 0 18px;gap:6px;display:grid;grid-template-columns:1fr auto;align-content:center}.fighter h2{margin:0;font-size:1.15rem;white-space:nowrap}.fighter .sprite{display:none}.hp-label{display:flex;grid-column:1/-1;justify-content:space-between;margin:0;font-size:.72rem;color:#55717b}.bar{display:block;grid-column:1/-1;height:8px;background:#d3dfd9;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#009a7b;transition:width .25s}.pp-row{margin:0;font-size:.75rem;white-space:nowrap}.status-list{margin:0;min-height:0;gap:3px}.tag{font-size:.65rem;padding:2px 4px}
#enemyName{color:#008d74}#enemyStatusShort{display:none}
.section-title{position:absolute;left:4%;bottom:31%;margin:0;z-index:2}.section-title h2{font-size:1.4rem;color:#008d7e}.section-title span{display:none}
.moves{position:absolute;left:1%;bottom:15%;width:min(74%,760px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;align-items:end}
.move{height:100px;padding:0 4px 5px;border:1px solid #c2c2c2;border-radius:0 0 9px 9px;background:linear-gradient(#c3c3c3 0 78%,#d9ffb2 78%);color:#43585b;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;box-shadow:0 2px 3px #477b7150;position:relative;overflow:hidden}
.move:before{content:"";position:absolute;top:0;left:0;right:0;height:76%;background:linear-gradient(135deg,#d8e8e4,#7fa5a0);z-index:0}
.move:nth-child(3n+1):before{background:linear-gradient(135deg,#b9d5e2,#5c8f9c)}.move:nth-child(3n+2):before{background:linear-gradient(135deg,#f5e8a8,#b1ad66)}.move:nth-child(3n):before{background:linear-gradient(135deg,#e0e0e0,#929a9b)}
.move-head,.move-desc{position:relative;z-index:1}.move-head{display:flex;flex-direction:column;align-items:center;gap:0;font-size:.77rem;line-height:1.1}.move-head>span:first-child{font-weight:850;background:#f0f2edc9;border-radius:4px;padding:1px 2px}.kind{font-size:.62rem;padding:1px 4px;border-radius:4px}.physical{background:#d9e6ee;color:#435d6a}.special{background:#f7eaa4;color:#8a7400}.status{background:#d6ffbb;color:#e06d00}.move-desc{font-size:.58rem;line-height:1.1;color:#3c5657;max-height:2.2em;overflow:hidden;margin:0}.move:disabled{opacity:.55}.move.selected{outline:4px solid #008e74;outline-offset:-4px;filter:brightness(1.08);transform:translateY(-4px)}.move.selected:after{content:"選択中";position:absolute;top:4px;left:3px;right:3px;background:#008e74;color:#fff;border-radius:4px;font-size:.62rem;font-weight:800;padding:2px;z-index:2}
.log{position:absolute;left:0;right:0;bottom:0;height:30px;min-height:30px;max-height:30px;overflow:hidden;border:0;border-radius:0;background:#008e74;color:white;padding:3px 14px;font-size:.85rem;line-height:1.4}.log p{margin:0;white-space:nowrap}.log p:not(:last-child){display:none}.log .system{color:white}
.controls{position:absolute;left:4%;bottom:24%;margin:0;z-index:2}.btn{border:1px solid #a5b9b8;background:#eaf4ef;color:#087d6d;padding:8px 14px;border-radius:9px;font-weight:750;cursor:pointer}.btn.primary{background:#008d91;color:white;border:0;border-radius:10px;min-width:260px;font-size:1.4rem;padding:4px 20px}.btn.primary:disabled{opacity:.45;cursor:not-allowed}.btn:hover{filter:brightness(1.1)}.note{display:none}
.overlay{position:fixed;inset:0;background:#063c35aa;display:grid;place-items:center;padding:20px;z-index:5}.modal{width:min(440px,100%);text-align:center;background:#eafff8;border:1px solid var(--line);border-radius:14px;padding:28px;color:var(--text)}.modal h2{margin-top:0}.modal p{color:#426e6a;line-height:1.7}.hidden{display:none!important}
@media(max-width:620px){body{padding:0}main{height:100dvh;min-height:560px}.brand{height:36px;padding:0 8px}.brand .eyebrow{display:none}.brand h1{font-size:.95rem}.stats{top:8px;right:6px;gap:3px}.stat{padding:4px 6px;gap:3px}.stat small{font-size:.6rem}.stat strong{font-size:.75rem}.fighter{width:60%;right:3%!important;padding-left:25px}.fighter h2{font-size:.95rem}.fighter .pp-row{font-size:.7rem}.section-title{left:4%;bottom:34%}.section-title h2{font-size:1.15rem}.moves{left:1%;width:98%;bottom:13%;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}.move{height:88px;padding:0 2px 4px}.move-head{font-size:.65rem}.move-desc{font-size:.5rem}.controls{left:4%;bottom:25%}.btn.primary{min-width:0;width:190px;font-size:1.15rem}.log{height:30px;min-height:30px;max-height:30px}}

/* Layout cleanup: keep each control in its own clear zone. */
.stats{left:12px;right:auto;top:12px;gap:8px}
.stat{box-shadow:0 1px 2px #315e5520;padding:5px 10px}
.arena{overflow:visible}
.fighter:first-child{top:15%;right:5%;width:32%;min-height:76px;height:auto;padding:8px 12px 8px 22px;border-radius:18px 0 0 18px;gap:6px;display:grid;grid-template-columns:1fr auto;align-content:center}
.fighter h2{font-size:1rem;grid-column:1/-1}
.pp-row{font-size:.75rem;color:#55717b}
.move-preview{position:absolute;left:2%;top:9%;width:min(300px,48%);min-height:90px;display:none;grid-template-columns:76px 1fr;gap:8px;padding:5px;background:#e0ffd2;border:4px solid #56b99b;border-radius:7px;color:#4a5b57;z-index:3;box-shadow:0 3px 8px #286b5c35}.move-preview.visible{display:grid}.preview-art{display:grid;place-items:center;min-height:76px;background:linear-gradient(135deg,#d4e8e7,#6aaca5);font-size:2.4rem;border:1px solid #80b9ad}.preview-info{min-width:0;display:flex;flex-direction:column;gap:3px}.preview-name{font-weight:850;border:1px solid #7cc79d;background:#eaffdf;padding:2px 4px;font-size:.92rem}.preview-power{font-weight:850;font-size:1rem}.preview-desc{font-size:.72rem;line-height:1.25}.section-title{left:4%;bottom:34%;z-index:2}
.section-title h2{margin:0;font-size:1.2rem}
.moves{left:1%;bottom:7%;width:78%;height:104px;display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;overflow-y:hidden;align-items:stretch;padding:0 0 3px;scrollbar-width:thin;scrollbar-color:#008e74 #b8eee3}
.move{flex:0 0 78px;width:78px;height:98px;min-width:0;padding:0 3px 5px;gap:3px}
.move-head{font-size:.68rem}
.move-desc{font-size:.54rem}
.controls{left:4%;bottom:39%;z-index:2}
.btn.primary{min-width:220px;font-size:1.25rem;padding:5px 18px}
.log{height:30px;min-height:30px;max-height:30px;padding:4px 12px}
@media(max-width:620px){
 .stats{left:7px;right:7px;top:8px;gap:4px}
 .stat{padding:4px 6px;gap:3px;flex:1;justify-content:center}
 .stat small{font-size:.58rem}.stat strong{font-size:.72rem}
 .fighter:first-child{top:20%;right:3%;width:70%;min-height:72px;padding-left:14px}.fighter:last-child{top:37%;right:3%;width:70%;min-height:72px;padding-left:14px}.move-preview{top:8%;left:2%;width:64%;grid-template-columns:60px 1fr;min-height:78px}.preview-art{min-height:64px;font-size:1.8rem}.preview-name{font-size:.78rem}.preview-power{font-size:.85rem}.preview-desc{font-size:.62rem}
 .fighter h2{font-size:.9rem}.pp-row{font-size:.67rem}
 .section-title{left:4%;bottom:35%}
 .section-title h2{font-size:1.05rem}
 .moves{left:1%;width:98%;bottom:7%;height:94px;gap:3px}
 .move{flex-basis:68px;width:68px;height:88px}
 .move-head{font-size:.62rem}.move-desc{font-size:.49rem}
 .controls{left:4%;bottom:40%}
 .btn.primary{width:190px;min-width:0;font-size:1.1rem}
}


#eventOverlay{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:#244a631c;pointer-events:none}#eventOverlay.visible{display:grid}.event-card{width:min(440px,84%);padding:18px 22px;border-radius:22px;background:#6689a8;color:white;text-align:center;box-shadow:0 6px 20px #233b5540;border:2px solid #ffffff80}.event-kicker{font-size:.8rem;letter-spacing:.12em}.event-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:900;line-height:1.25;text-shadow:2px 2px 0 #3b4c5e;margin:10px 0}.event-detail{font-size:1rem;font-weight:750}#turnBanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;padding:12px 30px;background:#008e74;color:white;border-radius:12px;font-weight:900;font-size:1.4rem;box-shadow:0 4px 14px #254b4250;pointer-events:none}#turnBanner.visible{display:block}
</style>
</head>
<body>
<main>
<header class="brand"><div class="eyebrow">G.F.風 BATTLE SYSTEM</div><h1>修行</h1><div style="background:#f4fff5;color:#008d74;border-radius:20px;padding:2px 22px;font-weight:800">C O L O S S E O</div><button class="btn" id="helpBtn" style="padding:2px 18px">教典</button></header>
<section class="panel">
<div class="stats">
<div class="stat"><small>あなたのHP</small><strong id="playerHpTop">40 / 40</strong></div>
<div class="stat"><small>PP（変化技用）</small><strong id="playerPpTop">10 / 10</strong></div>
<div class="stat"><small>所持金</small><strong id="playerMoneyTop">20円</strong></div>
</div>
<div class="arena">
<article class="fighter"><h2><span id="enemyName">ライバル</span><span id="enemyStatusShort"></span></h2><div class="sprite" id="enemySprite">👾</div><div class="hp-label"><span>HP</span><span id="enemyHpText">40 / 40</span></div><div class="bar"><span id="enemyHpBar"></span></div><div class="pp-row"><span>PP</span><span id="enemyPpText">10 / 10</span></div><div class="status-list" id="enemyStatuses"></div></article>
<article class="fighter"><h2><span>あなた</span><span id="playerStatusShort"></span></h2><div class="sprite" id="playerSprite">⚔️</div><div class="hp-label"><span>HP</span><span id="playerHpText">40 / 40</span></div><div class="bar"><span id="playerHpBar"></span></div><div class="pp-row"><span>PP</span><span id="playerPpText">10 / 10</span></div><div class="status-list" id="playerStatuses"></div></article>
</div>
<div id="eventOverlay" aria-live="assertive"><div class="event-card"><div class="event-kicker" id="eventKicker"></div><div class="event-title" id="eventTitle"></div><div class="event-detail" id="eventDetail"></div></div></div><div id="turnBanner"></div><div class="move-preview" id="movePreview" aria-live="polite"><div class="preview-art" id="previewArt">⚔️</div><div class="preview-info"><div class="preview-name" id="previewName">技を選択</div><div class="preview-power" id="previewPower"></div><div class="preview-desc" id="previewDesc"></div></div></div>\n<div class="section-title"><h2>祈る</h2><span>物理・特殊技はPPを消費しない</span></div>
<div class="moves" id="moveButtons"></div>
<div class="log" id="battleLog" aria-live="polite"><p class="system">コロッセオへようこそ！ わざを選んでバトル開始。</p></div>
<div class="controls"><button class="btn primary" id="restartBtn" disabled>技を選択</button></div>

</section>
</main>
<div class="overlay hidden" id="modal"><div class="modal"><h2 id="modalTitle">バトル終了</h2><p id="modalText"></p><button class="btn primary" id="modalBtn">閉じる</button></div></div>
<script>
/*
 * 技の追加方法：MOVES 配列にデータを追加してください。
 * type: physical / special / status
 * damage: 物理・特殊技の基礎ダメージ。status技では不要
 * ailment: burn / paralysis / freeze / confusion / sleep
 * status技だけPPを1消費します。
 */
const MOVES = [
 {id:"tackle",name:"たいあたり",type:"physical",damage:8,desc:"安定した物理攻撃。"},
 {id:"quick",name:"でんこうせっか",type:"physical",damage:6,desc:"小さなダメージを与える。"},
 {id:"flame",name:"ほのおのパンチ",type:"physical",damage:9,ailment:"burn",chance:.35,desc:"35%でやけどにする。"},
 {id:"spark",name:"10まんボルト",type:"special",damage:9,ailment:"paralysis",chance:.3,desc:"30%でまひにする。"},
 {id:"ice",name:"れいとうビーム",type:"special",damage:8,ailment:"freeze",chance:.25,desc:"25%でこおりにする。"},
 {id:"shadow",name:"シャドーボール",type:"special",damage:10,desc:"威力重視の特殊攻撃。"},
 {id:"confuse",name:"あやしいひかり",type:"status",ailment:"confusion",desc:"相手をこんらんさせる。"},
 {id:"sleep",name:"さいみんじゅつ",type:"status",ailment:"sleep",desc:"相手をねむらせる。"},
 {id:"willowisp",name:"おにび",type:"status",ailment:"burn",desc:"相手をやけどにする。"},
 {id:"thunderwave",name:"でんじは",type:"status",ailment:"paralysis",desc:"相手をまひさせる。"},
 {id:"protect",name:"まもる",type:"status",effect:"protect",desc:"次に受ける技を1回防ぐ。"},
 {id:"detect",name:"みきり",type:"status",effect:"protect",desc:"次に受ける技を1回防ぐ。"},
 {id:"band",name:"ちからのハチマキ",type:"item",effect:"band",desc:"次の物理技の威力+10。"},
 {id:"glasses",name:"ものしりメガネ",type:"item",effect:"glasses",desc:"次の特殊技の威力+10。"},
 {id:"potion",name:"きずぐすり",type:"item",effect:"potion",desc:"HPを5回復する。"},
 {id:"superpotion",name:"いいきずぐすり",type:"item",effect:"superpotion",desc:"HPを10回復する。"},
 {id:"hyperpotion",name:"すごいきずぐすり",type:"item",effect:"hyperpotion",desc:"HPを15回復する。"},
 {id:"substitute",name:"みがわり人形",type:"item",effect:"substitute",desc:"次に受ける攻撃・変化技を1回防ぐ。"}
];
const AILMENTS={burn:"やけど",paralysis:"まひ",freeze:"こおり",confusion:"こんらん",sleep:"ねむり"};
const state={player:null,enemy:null,turn:"player",ended:false,log:[],selectedMove:null,playerHand:[],enemyHand:[]};
function newFighter(name,sprite){return{name,sprite,hp:40,maxHp:40,pp:10,maxPp:10,money:20,ailments:{},freezeTurns:0,locked:false,protecting:false,physicalBoost:0,specialBoost:0};}
function drawCard(hand,excludeId=null){
 const candidates=MOVES.filter(m=>m.id!==excludeId&&!hand.some(card=>card.id===m.id));
 if(!candidates.length)return null;
 return candidates[Math.floor(Math.random()*candidates.length)];
}
function refillHand(hand,usedMove){
 const replacement=drawCard(hand,usedMove.id);
 if(replacement)hand.push(replacement);
}
function renderHand(){
 const box=$("moveButtons");box.innerHTML="";
 state.playerHand.forEach(m=>{
  const b=document.createElement("button");b.className="move";b.dataset.move=m.id;
  b.innerHTML='<div class="move-head"><span>'+m.name+'</span><span class="kind '+m.type+'">'+({physical:"物理",special:"特殊",status:"変化",item:"アイテム"}[m.type])+'</span></div><div class="move-desc">'+m.desc+(m.type==="status"?"（PP 1消費）":m.type==="item"?"（使用すると消費）":"（PP消費なし）")+'</div>';
  b.addEventListener("click",()=>selectMove(m.id));box.appendChild(b);
 });
}
function startBattle(){
 state.player=newFighter("あなた","🧢");state.enemy=newFighter("ライバル","👾");state.turn="player";state.ended=false;state.log=[];state.selectedMove=null;
 state.playerHand=[];state.enemyHand=[];
 while(state.playerHand.length<8&&state.playerHand.length<MOVES.length){const card=drawCard(state.playerHand);if(!card)break;state.playerHand.push(card);}
 while(state.enemyHand.length<8&&state.enemyHand.length<MOVES.length){const card=drawCard(state.enemyHand);if(!card)break;state.enemyHand.push(card);}
 $("restartBtn").textContent="技を選択";$("restartBtn").disabled=true;
 renderHand();log("バトル開始！ 相手はライバルだ。","system");render();$("moveButtons").querySelector("button")?.focus();
}
function $(id){return document.getElementById(id)}
function log(text,kind=""){state.log.push({text,kind});if(state.log.length>80)state.log.shift();const box=$("battleLog");box.innerHTML=state.log.map(x=>'<p class="'+x.kind+'">'+escapeHtml(x.text)+'</p>').join("");box.scrollTop=box.scrollHeight;}
function showBattleEvent(title,detail,kicker,duration){const o=$("eventOverlay");$("eventKicker").textContent=kicker||"バトル";$("eventTitle").textContent=title;$("eventDetail").textContent=detail||"";o.classList.add("visible");return new Promise(resolve=>setTimeout(()=>{o.classList.remove("visible");resolve();},duration||900));}
function showTurnBanner(text,duration){const e=$("turnBanner");e.textContent=text;e.classList.add("visible");return new Promise(resolve=>setTimeout(()=>{e.classList.remove("visible");resolve();},duration||650));}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const p=state.player,e=state.enemy;if(!p||!e)return;
 $("playerHpTop").textContent=p.hp+" / "+p.maxHp;$("playerPpTop").textContent=p.pp+" / "+p.maxPp;$("playerMoneyTop").textContent=p.money+"円";
 $("playerHpText").textContent=p.hp+" / "+p.maxHp;$("enemyHpText").textContent=e.hp+" / "+e.maxHp;$("playerPpText").textContent=p.pp+" / "+p.maxPp;$("enemyPpText").textContent=e.pp+" / "+e.maxPp;
 $("playerHpBar").style.width=Math.max(0,p.hp/p.maxHp*100)+"%";$("enemyHpBar").style.width=Math.max(0,e.hp/e.maxHp*100)+"%";
 $("playerHpBar").style.background=p.hp<=10?"var(--red)":"var(--green)";$("enemyHpBar").style.background=e.hp<=10?"var(--red)":"var(--green)";
 $("playerSprite").textContent=p.sprite;$("enemySprite").textContent=e.sprite;
 renderStatuses(p,"player");renderStatuses(e,"enemy");
 document.querySelectorAll(".move").forEach(b=>{const m=MOVES.find(x=>x.id===b.dataset.move);b.disabled=state.ended||state.turn!=="player"||(m.type==="status"&&p.pp<1)||p.hp<=0;b.classList.toggle("selected",state.selectedMove===m.id);});if(state.turn==="player"&&!state.ended){$("restartBtn").disabled=!state.selectedMove;$("restartBtn").textContent=state.selectedMove?(({status:"変化技を承認",item:"アイテムを使用",physical:"攻撃を承認",special:"攻撃を承認"})[MOVES.find(m=>m.id===state.selectedMove)?.type]||"承認"):"技を選択";}
}
function renderStatuses(f,side){const el=$(side+"Statuses");el.innerHTML=Object.keys(f.ailments).filter(k=>f.ailments[k]).map(k=>'<span class="tag '+k+'">'+AILMENTS[k]+'</span>').join("");$(side+"StatusShort").textContent=Object.keys(f.ailments).some(k=>f.ailments[k])?"状態異常":"";}
function applyAilment(target,type){if(!type)return;const existing=Object.keys(target.ailments).find(k=>target.ailments[k]);if(existing){log(target.name+"はすでに"+AILMENTS[existing]+"なので、状態異常は重ねがけできない！");return;}target.ailments[type]=true;if(type==="freeze")target.freezeTurns=3;log(target.name+"は"+AILMENTS[type]+"になった！","system");}
function showMovePreview(move,owner){const box=$("movePreview");box.classList.add("visible");$("previewArt").textContent=move.type==="physical"?"⚔️":move.type==="special"?"✨":move.type==="item"?"🎒":"🔮";$("previewName").textContent=(owner==="enemy"?"相手の技：":"")+move.name;const bonus=state[owner==="enemy"?"enemy":"player"]?.nextMoveBonus;const power=move.damage+(bonus&&bonus.id===move.id?bonus.amount:0);$("previewPower").textContent=move.type==="status"?"変化技・PP 1消費":move.type==="item"?"アイテム":(bonus&&bonus.id===move.id?"威力 ":"攻撃力 ")+power;$("previewDesc").textContent=move.desc; }
function selectMove(id){if(state.ended||state.turn!=="player")return;const move=state.playerHand.find(m=>m.id===id);if(!move)return;const chosen=state.playerHand.find(m=>m.id===state.selectedMove);if(move.type==="item"&&(move.effect==="band"||move.effect==="glasses")&&chosen&&(chosen.type==="physical"||chosen.type==="special")){if((move.effect==="band"&&chosen.type!=="physical")||(move.effect==="glasses"&&chosen.type!=="special")){log(move.name+"は"+(move.effect==="band"?"物理技":"特殊技")+"にだけ追加できます。");return;}state.player.nextMoveBonus={id:chosen.id,amount:10};state.playerHand=state.playerHand.filter(m=>m.id!==move.id);refillHand(state.playerHand,move);renderHand();state.selectedMove=chosen.id;showMovePreview(chosen,"player");$("restartBtn").disabled=false;$("restartBtn").textContent="攻撃を承認";log(move.name+"を"+chosen.name+"に追加！ 威力+10。");render();return;}if(move.type==="status"&&state.player.pp<1)return;state.selectedMove=id;document.querySelectorAll(".move").forEach(b=>b.classList.toggle("selected",b.dataset.move===id));$("restartBtn").disabled=false;$("restartBtn").textContent=move.type==="status"?"変化技を承認":move.type==="item"?"アイテムを使用":"攻撃を承認";showMovePreview(move,"player");log("「"+move.name+"」を選択中。下のボタンで承認すると行動します。");render();}
async function playerMove(){if(state.ended){startBattle();$("modal").classList.add("hidden");return;}if(state.turn!=="player"||!state.selectedMove)return;const move=state.playerHand.find(m=>m.id===state.selectedMove);if(!move)return;state.turn="resolving";state.selectedMove=null;state.playerHand=state.playerHand.filter(m=>m.id!==move.id);refillHand(state.playerHand,move);renderHand();document.querySelectorAll(".move").forEach(b=>b.classList.remove("selected"));$("movePreview").classList.remove("visible");$("restartBtn").disabled=true;$("restartBtn").textContent="相手の行動中…";render();
 // 相手は攻撃を受ける前に、防御技またはみがわり人形を割り込ませられる。
 const isIncomingAttack=move.type==="physical"||move.type==="special";
 const defense=state.enemyHand.find(m=>m.effect==="protect"||m.effect==="substitute");
 if(isIncomingAttack&&defense&&Math.random()<0.45){
  state.enemyHand=state.enemyHand.filter(m=>m.id!==defense.id);refillHand(state.enemyHand,defense);showMovePreview(defense,"enemy");$("previewPower").textContent="攻撃を1回防ぐ";
  await showBattleEvent("相手は"+defense.name+"！","攻撃を受ける前に防御した","相手の防御",900);
  state.enemy.protecting=true;log("相手は"+defense.name+"で攻撃を防ぐ構えをとった！","system");render();
 }
 await performMove(state.player,state.enemy,move,true);render();if(checkEnd())return;await showTurnBanner("相手のターン",650);if(checkEnd())return;enemyTurn();}
async function performMove(actor,target,move,isPlayer){
 if(actor.hp<=0)return;
 if(actor.ailments.sleep){if(Math.random()<.2){delete actor.ailments.sleep;await showBattleEvent("目を覚ました！",actor.name+"は眠りから回復した","ねむり",850);}else{await showBattleEvent("ぐうぐう眠っている……",actor.name+"は動けない","ねむり",1000);return;}}
 if(actor.ailments.freeze){actor.freezeTurns--;await showBattleEvent("こおって動けない！",actor.name+"は行動できない","こおり",1000);if(actor.freezeTurns<=0){delete actor.ailments.freeze;await showBattleEvent("こおりがとけた！",actor.name+"は再び動ける","状態異常",800);}return;}
 if(actor.ailments.paralysis&&Math.random()<.3){await showBattleEvent("まひして動けない！",actor.name+"は行動できない","まひ",1000);return;}
 let actualTarget=target;
 if(actor.ailments.confusion){
  const r=Math.random();
  if(r<.25){actualTarget=actor;await showBattleEvent("こんらん！",actor.name+"は自分を攻撃した！","こんらん",900);}
  else if(r<.5){actualTarget=target===state.player?state.enemy:state.player;await showBattleEvent("攻撃対象を見失った！",actor.name+"はこんらんしている","こんらん",900);}
  else await showBattleEvent("なんとか技を出した！",actor.name+"はこんらんしている","こんらん",750);
 }
 if(move.type!=="item"&&actualTarget.protecting){actualTarget.protecting=false;await showBattleEvent("攻撃を防いだ！",actualTarget.name+"は"+move.name+"を防いだ","防御",900);return;}
 if(move.type==="item"){if(move.effect==="potion"||move.effect==="superpotion"||move.effect==="hyperpotion"){const heal=move.effect==="potion"?5:move.effect==="superpotion"?10:15;const actual=Math.min(heal,actor.maxHp-actor.hp);actor.hp+=actual;await showBattleEvent(move.name+"を使った！",actor.name+"のHPが"+actual+"回復！","アイテム",900);}else if(move.effect==="substitute"){actor.protecting=true;await showBattleEvent("みがわり人形！",actor.name+"は次に受ける攻撃・変化技を防ぐ","アイテム",850);}else if(move.effect==="band"||move.effect==="glasses"){await showBattleEvent(move.name+"！","先に物理技または特殊技を選んでください","アイテム",850);}return;}
 if(move.type==="status"){actor.pp=Math.max(0,actor.pp-1);log(actor.name+"は "+move.name+" を使った！（PP -1）");}
 else log(actor.name+"の "+move.name+"！");
 if(move.effect==="protect"){actor.protecting=true;await showBattleEvent(move.name+"！",actor.name+"は次に受ける技を防ぐ構え","変化技",850);return;}
 if(move.type==="status"){applyAilment(actualTarget,move.ailment);return;}
 const bonus=actor.nextMoveBonus&&actor.nextMoveBonus.id===move.id?actor.nextMoveBonus.amount:0;if(bonus)actor.nextMoveBonus=null;let damage=move.damage+bonus+Math.floor(Math.random()*5)-2;
 if(move.type==="physical"&&actor.physicalBoost){damage+=actor.physicalBoost;actor.physicalBoost=0;}if(move.type==="special"&&actor.specialBoost){damage+=actor.specialBoost;actor.specialBoost=0;}
 if(actor.ailments.burn&&move.type==="physical"){damage-=10;log("やけどで物理技のダメージが10減った！");}
 damage=Math.max(1,damage);
 actualTarget.hp=Math.max(0,actualTarget.hp-damage);
 log(actualTarget.name+"に "+damage+" ダメージ！");
 if(actualTarget.hp>0&&move.ailment&&Math.random()<(move.chance||0))applyAilment(actualTarget,move.ailment);
}
async function endTurnEffects(f){if(f.ailments.burn&&f.hp>0){f.hp=Math.max(0,f.hp-2);await showBattleEvent("やけど！",f.name+"は2ダメージ！","ターン終了",1000);render();}}
function enemyTurn(){if(state.ended)return;const e=state.enemy,p=state.player;if(p.hp<=0||e.hp<=0){checkEnd();return;}
 // 相手もプレイヤーと同様に、技を選んでからカードを表示して実行する。
 let pool=state.enemyHand.filter(m=>m.type!=="status");if(!Object.keys(p.ailments).some(k=>p.ailments[k])&&e.pp>0&&Math.random()<.25){const statusPool=state.enemyHand.filter(m=>m.type==="status");if(statusPool.length)pool=statusPool;}
 if(!pool.length)pool=state.enemyHand;
 let move=pool[Math.floor(Math.random()*pool.length)];if(move.type==="status"&&e.pp<1){const attacks=state.enemyHand.filter(m=>m.type!=="status");if(attacks.length)move=attacks[Math.floor(Math.random()*attacks.length)];}if(move.type==="physical"||move.type==="special"){const boostId=move.type==="physical"?"band":"glasses";const boost=state.enemyHand.find(m=>m.effect===boostId);if(boost){e.nextMoveBonus={id:move.id,amount:10};state.enemyHand=state.enemyHand.filter(m=>m.id!==boost.id);refillHand(state.enemyHand,boost);log("相手は"+boost.name+"を"+move.name+"に追加した！","system");}}
 state.turn="enemyPreview";
 showMovePreview(move,"enemy");
 $("previewPower").textContent=move.type==="status"?"変化技・PP 1消費":"攻撃力 "+move.damage;
 $("restartBtn").disabled=true;$("restartBtn").textContent="相手が技を選択中…";
 log("相手は「"+move.name+"」を選択した！","system");
 render();
 setTimeout(()=>{if(state.ended)return;state.enemyHand=state.enemyHand.filter(m=>m.id!==move.id);refillHand(state.enemyHand,move);performMove(e,p,move,false);endTurnEffects(p);endTurnEffects(e);if(checkEnd())return;$("movePreview").classList.remove("visible");state.turn="player";$("restartBtn").textContent="技を選択";$("restartBtn").disabled=true;render();},1500);
}
function checkEnd(){if(state.player.hp<=0||state.enemy.hp<=0){state.ended=true;state.turn="ended";const win=state.enemy.hp<=0&&state.player.hp>0;log(win?"勝利！ ライバルを倒した！":"敗北…… 次は作戦を変えてみよう。","system");$("modalTitle").textContent=win?"YOU WIN!":"YOU LOSE";$("modalText").textContent=win?"勝利！ 初期所持金は20円です。":"HPが0になった。もう一度挑戦しよう。";$("modal").classList.remove("hidden");render();return true;}render();return false;}
$("restartBtn").addEventListener("click",playerMove);$("modalBtn").addEventListener("click",()=>{if(state.ended){$("modal").classList.add("hidden");startBattle();}else $("modal").classList.add("hidden");});
$("helpBtn").addEventListener("click",()=>{$("modalTitle").textContent="ルール";$("modalText").textContent="HPは40、PPは10、所持金は20円で開始。物理・特殊技はPPを消費せず、変化技だけPPを1消費します。やけど：ターン終了時にHP-2、物理技のダメージ-10。まひ：30%で行動不能。こおり：3ターン行動不能。こんらん：攻撃対象が乱れ、自分を攻撃する場合もあります。ねむり：毎ターン20%で目覚めます。";$("modal").classList.remove("hidden");});
startBattle();
</script>
