/* GitHub Pages 用の対人通信。PeerJS のデータ接続を使い、ホストがゲーム状態を管理する。 */
function makeRoomService(){
 const makeGuest=(roomId,limit=15000)=>new Promise((resolve,reject)=>{
  const peer=new Peer();let done=false,conn=null,local={peer:"",presence:{},sameTab:true},remote={peer:roomId,presence:{},sameTab:false},players={},cb=()=>{},isOpen=false;
  const finishErr=e=>{if(done)return;done=true;try{peer.destroy()}catch(_){}reject(e instanceof Error?e:new Error("部屋に接続できませんでした"))};
  peer.on("error",e=>finishErr(e));
  peer.on("open",id=>{local.peer=id;conn=peer.connect(roomId,{reliable:true});conn.on("open",()=>{isOpen=true;done=true;resolve(roomObject())});conn.on("data",msg=>{if(!msg||typeof msg!=="object")return;if(msg.type==="host-state"){remote.presence=msg.host||{};players=msg.players||{};if(msg.g)remote.presence.g=msg.g;cb()}else if(msg.type==="host-presence"){remote.presence=msg.host||{};players=msg.players||{};cb()}});conn.on("close",()=>{finishErr(new Error("ホストとの接続が切れました"))});});
  const roomObject=()=>({
   presence:async data=>{local.presence={...local.presence,...data};if(conn&&conn.open)conn.send({type:"guest-presence",data});return true},
   onPeers:fn=>{cb=fn||(()=>{});if(isOpen)cb()},
   peers:()=>{const arr=[{peer:local.peer,presence:local.presence,sameTab:true}];if(remote.presence)arr.push({peer:roomId,presence:remote.presence,sameTab:false});for(const [id,pres] of Object.entries(players||{})){if(id!==local.peer&&id!==roomId)arr.push({peer:id,presence:pres,sameTab:false})}return arr},
   close:()=>{try{conn&&conn.close();peer.destroy()}catch(_){}}
  });
  setTimeout(()=>{if(!done)finishErr(new Error("部屋が見つかりません。ホストが先に同じ6桁の番号で入室してください。"))},limit);
 });
 const makeHost=roomId=>new Promise((resolve,reject)=>{
  const peer=new Peer(roomId);let done=false,local={peer:roomId,presence:{},sameTab:true},remotes={},connections={},cb=()=>{};
  const roster=()=>Object.fromEntries(Object.entries(remotes).map(([id,p])=>[id,p.presence||{}]));
  const broadcast=()=>{const msg={type:"host-presence",host:local.presence,players:roster()};Object.values(connections).forEach(conn=>{if(conn.open)try{conn.send(msg)}catch(_){}})};
  const onChange=()=>{broadcast();cb()};
  const attach=conn=>{conn.on("data",msg=>{if(!msg||typeof msg!=="object")return;if(msg.type==="guest-presence"){remotes[conn.peer]=remotes[conn.peer]||{peer:conn.peer,presence:{},sameTab:false};remotes[conn.peer].presence={...remotes[conn.peer].presence,...msg.data};onChange()} });conn.on("close",()=>{delete remotes[conn.peer];delete connections[conn.peer];onChange()});};
  const timer=setTimeout(()=>{if(!done){done=true;try{peer.destroy()}catch(_){};reject(new Error("部屋の作成に時間がかかっています。通信環境を確認して再試行してください。"))}},15000);
  peer.on("open",()=>{if(done)return;done=true;clearTimeout(timer);resolve(roomObject())});
  peer.on("connection",conn=>{connections[conn.peer]=conn;remotes[conn.peer]={peer:conn.peer,presence:{},sameTab:false};attach(conn);conn.on("open",()=>{try{conn.send({type:"host-presence",host:local.presence,players:roster()})}catch(_){}});onChange()});
  peer.on("error",e=>{if(!done){done=true;clearTimeout(timer);try{peer.destroy()}catch(_){};reject(e)}});
  const roomObject=()=>({
   presence:async data=>{local.presence={...local.presence,...data};const msg=data.g?{type:"host-state",host:local.presence,players:roster(),g:data.g}:{type:"host-presence",host:local.presence,players:roster()};Object.values(connections).forEach(conn=>{if(conn.open)try{conn.send(msg)}catch(_){}});return true},
   onPeers:fn=>{cb=fn||(()=>{});cb()},
   peers:()=>[{peer:roomId,presence:local.presence,sameTab:true},...Object.values(remotes)],
   close:()=>{try{Object.values(connections).forEach(conn=>{try{conn.close()}catch(_){}});Object.keys(remotes).forEach(id=>{delete remotes[id];delete connections[id]});peer.destroy()}catch(_){}}
  });
 });
 return {join:async(roomId,onWait)=>{
  const t0=Date.now();
  for(;;){
   try{return await makeHost(roomId)}catch(e){if(!e||e.type!=="unavailable-id")throw e}
   /* 番号が使用中: 本物の部屋ならゲストとして入る。前回の部屋の残骸なら解放されるまで待って再挑戦 */
   try{return await makeGuest(roomId,8000)}catch(_){}
   if(Date.now()-t0>90000)throw new Error("部屋番号がまだ解放されていません");
   if(onWait)onWait(Math.round((Date.now()-t0)/1000));
   await sl(1500);
  }
 }};
}

function showRules(){ $("mt").textContent="ルール"; $("mx").innerHTML=`<div class="rules-layout">
<section class="rule-card"><h3>ゲームの基本</h3><p>HP <b>50</b>・PP <b>10</b>・所持金 <b>20円</b>で開始。通常のHP上限は99、PP上限は99。手札は基本9枚です。</p><p>最後まで生き残ったプレイヤーが勝利。対戦人数は自分を含め最大9人です。</p></section>
<section class="rule-card"><h3>ターンの進め方</h3><ul><li>手札からカードを選び「使う」。攻撃・変化技は対象を選びます。</li><li>攻撃技や変化技には、対応する強化カードを一緒に使えます。</li><li>使えるカードがない・使わない場合は、カードを1枚捨てて交代できます。</li><li>PPが0でも「うたう」でカードを得られます。PPが残っていても、手札に攻撃技がない場合は「様子をみる」でカードを得られます。</li></ul></section>
<section class="rule-card"><h3>PP・強化・アイテム</h3><p>攻撃技・変化技・通常の防御カードは使用時にPPを1消費します。<b>みがわりの人形はPPを消費しません。</b>PPが足りないと技や防御を使えません。</p><ul><li>ちからのハチマキ：物理技＋5</li><li>ものしりメガネ：特殊技＋5</li><li>いのちのたま：技＋10、攻撃が通ると自分も5ダメージ</li><li>ねらいのまと：所持者に対する相手の追加効果・一撃必殺が必ず成功</li><li>マスターボール：ポケモンを呼び出す</li></ul></section>
<section class="rule-card"><h3>防御カード</h3><p>防御フェイズでは防御カードを複数枚重ねられます。軽減量は合計され、固定の枚数上限はありません（PPの範囲内）。</p><ul><li>まもる・みきり・みがわりの人形：攻撃技・変化技を完全に防ぐ</li><li>かたくなる：物理−4、めいそう：特殊−4</li><li>コスモパワー：物理・特殊−4</li><li>てっぺき・とける・バリアー：物理−8</li><li>ドわすれ・ブレイブチャージ：特殊−8</li><li>ぼうぎょしれい：物理・特殊−8</li><li>コットンガード：物理−12</li><li>リフレクター・ひかりのかべ：対応する物理・特殊ダメージを3ターン−5</li></ul></section>
<section class="rule-card"><h3>攻撃技・成功率</h3><ul><li>通常攻撃の威力はカードに表示された数値どおり。全体攻撃は自分以外が対象です。</li><li>じしん：物理・全体に8ダメージ／なみのり：特殊・全体に5ダメージ</li><li>ぜったいれいど・じわれ：自分以外それぞれ20%で一撃必殺</li><li>攻撃技の追加効果は通常30%。変化技（あやしいひかり・さいみんじゅつ・おにび・でんじは）は成功率75%。</li><li>きあいだまは30%で外れ、ふぶきは対象ごとに30%で外れます。</li><li>まねっこ：直前に使われた技（ポケモンの技も含む）の威力・物理/特殊・単体/全体をそのまま真似ます。一撃必殺も真似られます。追加効果は真似られず、強化カードも重ねられません。直前の技がないと使えません。</li><li>ゆびをふる：全ての攻撃技の中からランダムに1つ選んで使います（まねっこ・ゆびをふる自身は除く）。強化カードは重ねられません。</li><li>きあいのタスキ：手札に持っていると、倒される攻撃を受けてもHP1で耐え、タスキを消費します。一度使うと、そのゲームでそのプレイヤーにタスキが配られることはありません。</li><li>技にはポケモンと同じタイプがあり、カードに表示されます（今のところ、タイプ相性による威力の変化はありません）。</li><li>タイプジュエル（ノーマル・ほのお・みず・でんき・くさ）：同じタイプの攻撃技に重ねると威力+7。</li><li>ドレインパンチ・ギガドレイン・パラボラチャージは、与えたダメージ分HPが回復します。ハイドロポンプ・かみなりは30%で外れます。アクアジェットは防御できません。</li></ul></section>
<section class="rule-card"><h3>状態異常</h3><ul><li>やけど：ターン行動後に2ダメージ。物理技の威力−5。</li><li>まひ：30%で行動不能。</li><li>こおり：3回行動不能。</li><li>ねむり：各ターン20%で目覚める。</li><li>こんらん：自分を攻撃することがあります。</li><li>どく：ターン経過でダメージ。</li></ul><p>状態異常は重複しません。</p></section>
<section class="rule-card"><h3>お金・商売</h3><p>カードごとに効果の強さ・汎用性・成功率に応じた価格が設定されています。基本技は3〜5円、標準的な攻撃・回復・変化技は6〜8円、強力な技や防御は9〜12円、一撃必殺技・マスターボールは15円、ねらいのまとは20円が目安です。ショップでは候補カードごとに表示された価格を支払って購入します。</p><p>両替はHP・PP・お金を1:1で交換。売るカードでは相手に代金を請求し、所持金が足りなければPP、PPも足りなければHPで支払います。</p></section>
<section class="rule-card"><h3>終末の時</h3><p>開始前に「何行動後に開始するか」を設定できます。設定回数に達すると終末の時が始まり、その後は各行動後に25%でイベント発生。</p><ul><li>イベルタル：10ダメージ</li><li>ウルトラネクロズマ：20ダメージ</li><li>ムゲンダイマックスムゲンダイナ：30ダメージ</li><li>アルセウス：HPまたはPPを最大10回復、または10円獲得</li><li>ニューラ：手札を最大2枚盗む</li></ul><p>終末の時の攻撃は通常の防御カードでは防げません。</p></section>
<section class="rule-card"><h3>コンピューター戦</h3><ul><li>初心者：対象・カード選択がランダム中心。</li><li>中級者：状況に応じて攻撃や回復などを選びます。</li><li>上級者：HP・PP・状態・戦況に応じたカード補充と行動を優先します。</li></ul></section>
<section class="rule-card"><h3>対人戦</h3><p>2台それぞれで同じ6桁の部屋番号を入力し、ホストがゲームを開始します。インターネット接続が必要です。最大9人で対戦できます。</p></section>

<style>
#cardtip{position:fixed;z-index:9999;max-width:230px;background:var(--cd,#fff);color:var(--tx,#087d6d);border:2px solid var(--ac,#008e74);border-radius:10px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.28);font-size:.8rem;line-height:1.4;pointer-events:none;display:none}

#hand .c:disabled{pointer-events:none}
</style>
<script>
(function(){
 const tip=document.createElement("div");tip.id="cardtip";document.body.appendChild(tip);
 let cur=null,lastTouch=0,timer=0,hideT=0,long=false,sx=0,sy=0;
 const hand=()=>document.getElementById("hand");
 const cardAt=(x,y)=>{const h=hand();if(!h)return null;for(const el of h.querySelectorAll(".c")){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return el}return null};
 const detail=id=>{const c=C.find(x=>x.id===id);if(!c)return "";const e=ef(c);let l="";
  if(c.t==="a"){l=e.ko?"一撃必殺":((e.k==="p"?"物理":e.k==="s"?"特殊":"")+"威力"+e.d)}
  return "<div class='tt'><b>"+esc(c.n)+"</b>"+tyTag(c)+"<span class='tag'>"+esc(lab(c))+"</span><span class='tag'>¥"+pr(c)+"</span></div>"+(l?"<div>"+esc(l)+"</div>":"")+"<div class='ds'>"+esc(c.mimic?mimicInfo(c):(c.x||""))+((c.t==="a"||c.t==="s")?"（PP1）":"")+"</div>"};
 const place=(x,y,rect)=>{tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight,W=innerWidth,H=innerHeight;let left,top;
  if(rect){left=rect.left+rect.width/2-w/2;top=rect.top-h-8;if(top<4)top=rect.bottom+8}else{left=x+14;top=y+18;if(left+w>W-4)left=x-w-14;if(top+h>H-4)top=y-h-14}
  tip.style.left=Math.max(4,Math.min(left,W-w-4))+"px";tip.style.top=Math.max(4,Math.min(top,H-h-4))+"px"};
 const hide=()=>{tip.style.display="none";cur=null};
 const show=(el,x,y,rect)=>{if(cur!==el){tip.innerHTML=detail(el.dataset.cid);cur=el}place(x,y,rect)};
 // PC：カーソルを乗せると表示
 document.addEventListener("mousemove",e=>{if(Date.now()-lastTouch<800)return;const el=cardAt(e.clientX,e.clientY);if(el&&el.dataset.cid)show(el,e.clientX,e.clientY);else hide()});
 document.addEventListener("mouseleave",hide);
 // スマホ：長押しで表示
 document.addEventListener("touchstart",e=>{lastTouch=Date.now();clearTimeout(timer);clearTimeout(hideT);long=false;hide();const p=e.touches[0],el=cardAt(p.clientX,p.clientY);if(!el||!el.dataset.cid)return;sx=p.clientX;sy=p.clientY;
  timer=setTimeout(()=>{long=true;show(el,sx,sy,el.getBoundingClientRect());if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}},450)},{passive:true});
 document.addEventListener("touchmove",e=>{lastTouch=Date.now();const p=e.touches[0];if(!long&&Math.hypot(p.clientX-sx,p.clientY-sy)>10)clearTimeout(timer)},{passive:true});
 document.addEventListener("touchend",e=>{lastTouch=Date.now();clearTimeout(timer);if(long){e.preventDefault();hideT=setTimeout(hide,1500)}},{passive:false});
 document.addEventListener("touchcancel",()=>{clearTimeout(timer);hide()});
 // 長押し後のクリック（カードを出す動作）を防ぐ
 document.addEventListener("click",e=>{if(long){e.stopPropagation();e.preventDefault();long=false}},true);
 document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("#hand"))e.preventDefault()});
})();
</script>
