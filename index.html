<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Colosseo</title>
<style>
:root{--bg:#55b99b;--pn:#eafff8;--cd:#fff;--ac:#008e74;--tx:#087d6d;--mu:#4f7f7d;--bd:#9fd8cc;--lo:#d9534f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2a25;--pn:#123a34;--cd:#1b4d45;--ac:#12a58a;--tx:#d2f7ee;--mu:#93c8bc;--bd:#2f6e63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b2a25;--pn:#123a34;--cd:#1b4d45;--ac:#12a58a;--tx:#d2f7ee;--mu:#93c8bc;--bd:#2f6e63;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:760px;height:100%;margin:auto;display:flex;flex-direction:column;background:var(--pn);position:relative;overflow:hidden}
header{background:var(--ac);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 12px}h1{font-size:1rem;margin:0}
.fs{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:8px 10px}.pl{display:flex;align-items:center;gap:10px;width:min(360px,100%);background:#eeecec;color:#4b6574;border:1px solid #aaa;border-radius:20px;padding:5px 14px}.pl i{width:12px;height:12px;border-radius:50%;background:#aaa;flex:none}.pl .n{flex:1;font-size:1.05rem}.pl.e .n{color:#008d74}.pl.p .n{color:#4b4be0}.pl span{font-size:.7rem;color:#607d88}.pl span b{font-size:1rem;margin-left:3px;color:#4b6574}.pl span b.lo{color:#d9534f}
.f{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}.f h2{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between}
.f small{color:var(--mu);display:flex;justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:4px 0}.bar span{display:block;height:100%;background:var(--ac);transition:width .25s}.bar span.lo{background:var(--lo)}
.tag{color:#fff;background:#e0872f;border-radius:4px;padding:0 5px;font-size:.68rem}
#pv{margin:0 8px}.bd2{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:96px}.zc{font-size:.7rem;color:var(--mu);margin-bottom:2px}.zn{display:flex;gap:4px;flex-wrap:wrap;min-height:50px}.mc{flex:1 1 70px;max-width:120px;border:1px solid var(--bd);border-left:5px solid var(--c);background:var(--cd);border-radius:6px;padding:3px 5px}.mc b{font-size:.72rem;display:block}.mc small{font-size:.6rem;color:var(--mu)}.pill{margin-top:4px;text-align:center;font-weight:900;font-size:1.2rem;border:3px solid #4a5b57;background:#ddffc8;color:#4a5b57;border-radius:10px;padding:0 8px}
#ph{padding:6px 12px;font-weight:700}
#hand{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:6px 8px;align-content:start}
.c{border:1px solid var(--bd);border-top:5px solid var(--c);background:var(--cd);color:var(--tx);border-radius:8px;padding:5px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:80px;align-items:flex-start}
.c b{font-size:.78rem}.c small{font-size:.65rem;color:var(--mu)}.c:disabled{opacity:.4;cursor:default}.c.on{outline:3px solid var(--ac);transform:translateY(-3px)}
.a{--c:#e0872f}.b{--c:#d4b100}.d{--c:#4a7fd1}.h{--c:#3aa86b}.s{--c:#9a5fc9}
.acts{display:flex;gap:8px;padding:6px 8px;justify-content:center;min-height:46px}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;font:inherit}.btn.pri{background:var(--ac);color:#fff;border:0}.btn:disabled{opacity:.4;cursor:default}
#log{background:var(--ac);color:#fff;padding:5px 12px;height:46px;overflow:hidden;font-size:.8rem}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#6689a8;color:#fff;padding:12px 22px;border-radius:16px;font-weight:800;font-size:1.05rem;display:none;pointer-events:none;text-align:center;max-width:86%;z-index:5}#toast.on{display:block}
.ov{position:absolute;inset:0;background:#063c35aa;display:grid;place-items:center;z-index:9}.md{background:var(--pn);border-radius:14px;padding:22px;width:min(420px,90%);text-align:center;line-height:1.7}
</style></head><body><main>
<header><h1>Pokémon Colosseo</h1><button class="btn" id="hb">ルール</button></header>
<div class="fs" id="fs"></div>
<div id="pv"></div><div id="ph"></div>
<div id="hand"></div>
<div class="acts"><button class="btn pri" id="use">使う</button><button class="btn" id="pass">1枚捨てて交代</button><button class="btn pri" id="skip">防御せず受ける</button></div>
<div id="log"></div><div id="toast"></div>
<div class="ov" id="md" hidden><div class="md"><h2 id="mt"></h2><p id="mx"></p><button class="btn pri" id="mb">閉じる</button></div></div>
</main>
<script>
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms)),rd=a=>a[Math.random()*a.length|0];
const AIL={burn:"やけど",paralysis:"まひ",freeze:"こおり",confusion:"こんらん",sleep:"ねむり"},KL={p:"物理",s:"特殊"};
// t: a=攻撃 b=強化 d=防御 h=回復 s=変化(PP1)  k: p物理 s特殊  d:威力/回復量  b:完全防御 r:軽減量
const C=[
{id:"tackle",n:"たいあたり",t:"a",k:"p",d:8,x:"安定した物理攻撃"},
{id:"quick",n:"でんこうせっか",t:"a",k:"p",d:6,x:"小ダメージ"},
{id:"flame",n:"ほのおのパンチ",t:"a",k:"p",d:9,al:"burn",ch:.35,x:"35%でやけど"},
{id:"spark",n:"10まんボルト",t:"a",k:"s",d:9,al:"paralysis",ch:.3,x:"30%でまひ"},
{id:"ice",n:"れいとうビーム",t:"a",k:"s",d:8,al:"freeze",ch:.25,x:"25%でこおり"},
{id:"shadow",n:"シャドーボール",t:"a",k:"s",d:10,x:"威力重視"},
{id:"band",n:"ちからのハチマキ",t:"b",k:"p",d:10,x:"物理技に重ねて+10"},
{id:"glasses",n:"ものしりメガネ",t:"b",k:"s",d:10,x:"特殊技に重ねて+10"},
{id:"protect",n:"まもる",t:"d",r:10,bs:1,x:"ダメージ-10・変化技無効（PP1）"},
{id:"detect",n:"みきり",t:"d",r:10,bs:1,x:"ダメージ-10・変化技無効（PP1）"},
{id:"sub",n:"みがわり人形",t:"d",r:0,b:1,bs:1,x:"攻撃も変化技も全て無効（PP1）"},
{id:"harden",n:"かたくなる",t:"d",r:8,x:"ダメージ-8（PP1）"},
{id:"light",n:"ひかりのかべ",t:"d",k:"s",r:10,x:"特殊技の威力-10（PP1）"},
{id:"wall",n:"リフレクター",t:"d",k:"p",r:10,x:"物理技の威力-10（PP1）"},
{id:"iron",n:"てっぺき",t:"d",r:14,x:"ダメージ-14（PP1）"},
{id:"potion",n:"きずぐすり",t:"h",d:5,x:"HP+5"},
{id:"super",n:"いいきずぐすり",t:"h",d:10,x:"HP+10"},
{id:"hyper",n:"すごいきずぐすり",t:"h",d:15,x:"HP+15"},
{id:"pp1",n:"ピーピーエイド",t:"h",pp:1,x:"PP+1"},
{id:"pp2",n:"ピーピーリカバー",t:"h",pp:2,x:"PP+2"},
{id:"pp3",n:"ピーピーエイダー",t:"h",pp:3,x:"PP+3"},
{id:"pp4",n:"ピーピーマックス",t:"h",pp:4,x:"PP+4"},
{id:"oran",n:"オボンの実",t:"h",d:10,x:"HP+10"},
{id:"himeri",n:"ヒメリの実",t:"h",pp:2,x:"PP+2"},
{id:"cure",n:"なんでもなおし",t:"h",cure:1,x:"状態異常を治す"},
{id:"confuse",n:"あやしいひかり",t:"s",al:"confusion",x:"こんらん（PP1）"},
{id:"sleep",n:"さいみんじゅつ",t:"s",al:"sleep",x:"ねむり（PP1）"},
{id:"wisp",n:"おにび",t:"s",al:"burn",x:"やけど（PP1）"},
{id:"wave",n:"でんじは",t:"s",al:"paralysis",x:"まひ（PP1）"}];
const pool=C.flatMap(c=>Array(c.id==="sub"?1:c.t==="a"?8:4).fill(c));
const lab=c=>c.t==="a"?KL[c.k]:{b:"強化",d:"防御",h:"回復",s:"変化"}[c.t];
let S;const mk=n=>({n,hp:40,pp:5,mo:20,hand:[],al:null,fz:0});
const draw=f=>{while(f.hand.length<9)f.hand.push(rd(pool))};
const main=()=>{const i=S.sel.find(i=>S.p.hand[i].t!=="b");return i==null?null:S.p.hand[i]};
function log(t){S.L.push(t);$("log").innerHTML=S.L.slice(-2).map(x=>"<div>"+x+"</div>").join("")}
function ev(t,ms=850){log(t);const o=$("toast");o.textContent=t;o.classList.add("on");return sl(ms).then(()=>o.classList.remove("on"))}
const mc=c=>"<div class='mc "+c.t+"'><b>"+c.n+"</b><small>"+c.x+"</small></div>";
const red=(ds,c)=>ds.reduce((s,x)=>s+(!x.k||x.k===c.k?x.r:0),0);
function board(c1,a,t1,c2,d,t2){$("pv").innerHTML="<div class='bd2'><div><div class='zc'>"+c1+"</div><div class='zn'>"+a.map(mc).join("")+"</div>"+(t1?"<div class='pill'>"+t1+"</div>":"")+"</div><div><div class='zc'>"+c2+"</div><div class='zn'>"+d.map(mc).join("")+"</div>"+(t2?"<div class='pill'>"+t2+"</div>":"")+"</div></div>"}
function show(a,c,bo,ds){board(a.n+"の"+(c.t==="a"?"攻撃":"行動"),[c,...(S.bc||[])],c.t==="a"?"攻"+(c.d+bo):lab(c),ds?"防御":"",ds||[],ds&&ds.length?(ds.some(x=>x.b||c.t==="s"&&x.bs)?"完全防御":c.t==="s"?"無効化できない":"守"+red(ds,c)):"")}
function selShow(){const m=main();if(!m){$("pv").innerHTML="";return}const bs=S.sel.map(i=>S.p.hand[i]).filter(c=>c.t==="b");S.bc=bs;show(S.p,m,bs.reduce((s,c)=>s+c.d,0),null)}
function pv(a,c,bo){$("pv").innerHTML="<b>"+a.n+"の "+c.n+"</b> "+(c.t==="a"?"威力 "+(c.d+bo):lab(c))+"<br><small>"+c.x+"</small>"}
function ok(c,i){if(S.mode==="def")return c.t==="d"&&(S.sel.includes(i)||S.p.pp>S.sel.length);if(S.mode!=="atk"||c.t==="d")return false;
 if(c.t==="s"&&S.p.pp<1)return false;if(c.t==="b"){const m=main();return !!m&&m.t==="a"&&m.k===c.k}return true}
function click(i){const c=S.p.hand[i];if(!c||!ok(c,i))return;if(S.mode==="def"){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):[...S.sel,i];render();return}
 if(c.t==="b")S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):[...S.sel,i];
 else S.sel=S.sel.length===1&&S.sel[0]===i?[]:[i];render()}
function render(){
 $("fs").innerHTML=["e","p"].map(k=>{const f=S[k];return '<div class="pl '+k+'"><i></i><b class="n">'+f.n+'</b>'+(f.al?'<span class="tag">'+AIL[f.al]+'</span>':'')+'<span>HP<b class="'+(f.hp<=10?"lo":"")+'">'+f.hp+'</b></span><span>PP<b>'+f.pp+'</b></span><span>¥<b>'+f.mo+'</b></span></div>'}).join("");
 const hb=$("hand");hb.innerHTML="";
 S.p.hand.forEach((c,i)=>{const b=document.createElement("button");b.className="c "+c.t+(S.sel.includes(i)?" on":"");b.disabled=!ok(c,i);
  b.innerHTML="<b>"+c.n+"</b><span class='tag'>"+lab(c)+"</span><small>"+c.x+"</small>";b.onclick=()=>click(i);hb.appendChild(b)});
 $("ph").textContent={atk:"あなたのターン：カードを選んで「使う」（攻撃には強化カードを重ねられます）",def:"防御フェイズ：防御カードを選び（重ねがけOK）「防御する」",idle:"…"}[S.mode];
 $("use").hidden=!(S.mode==="atk"||S.mode==="def");$("pass").hidden=S.mode!=="atk";$("use").textContent=S.mode==="def"?"防御する":"使う";$("skip").hidden=S.mode!=="def";
 $("use").disabled=S.mode==="def"?!S.sel.length:!main();if(S.mode==="atk")selShow();else if(S.mode==="def")show(S.inc.a,S.inc.c,S.inc.bo,S.sel.map(i=>S.p.hand[i]));$("pass").disabled=S.sel.length!==1}
async function can(a){
 if(a.al==="sleep"){if(Math.random()<.2){a.al=null;await ev(a.n+"は目を覚ました！")}else{await ev(a.n+"はぐうぐう眠っている…");return false}}
 if(a.al==="freeze"){if(--a.fz<=0){a.al=null;await ev(a.n+"のこおりがとけた！")}else{await ev(a.n+"はこおって動けない！");return false}}
 if(a.al==="paralysis"&&Math.random()<.3){await ev(a.n+"はまひして動けない！");return false}
 return true}
async function burn(a){if(a.al==="burn"&&a.hp>0){a.hp=Math.max(0,a.hp-2);render();await ev(a.n+"はやけどで2ダメージ！")}}
async function apply(t,al){if(t.al){await ev(t.n+"はすでに"+AIL[t.al]+"だ！");return}t.al=al;t.fz=4;render();await ev(t.n+"は"+AIL[al]+"になった！")}
const comb=ds=>({n:ds.map(x=>x.n).join("＋"),ds,bs:ds.some(x=>x.bs),b:ds.some(x=>x.b)});
async function getDef(t,c,bo){let d=null;
 if(t===S.e){const ds=t.hand.filter(x=>x.t==="d"&&(!x.k||x.k===c.k)).slice(0,Math.min(t.pp,1+(Math.random()<.4)));if(ds.length&&Math.random()<.5){ds.forEach(x=>t.hand.splice(t.hand.indexOf(x),1));t.pp-=ds.length;draw(t);d=comb(ds);show(S.inc.a,S.inc.c,S.inc.bo,ds)}}
 else{S.mode="def";S.sel=[];render();const ix=await new Promise(r=>S.wait=r);S.mode="idle";S.sel=[];if(ix.length){const ds=ix.map(i=>S.p.hand[i]);S.p.hand=S.p.hand.filter((_,i)=>!ix.includes(i));S.p.pp-=ds.length;draw(S.p);d=comb(ds);show(S.inc.a,S.inc.c,S.inc.bo,ds)}render()}
 if(d)await ev(t.n+"は "+d.n+"！",800);return d}
async function act(a,o,c,bo){await act0(a,o,c,bo);await burn(a)}
async function act0(a,o,c,bo){
 if(!await can(a))return;
 if(c.t==="h"){if(c.cure){const had=a.al;a.al=null;render();return ev(had?a.n+"の"+AIL[had]+"が治った！":"しかし何も起こらなかった…")}if(c.pp){const g=Math.min(c.pp,99-a.pp);a.pp+=g;render();return ev(a.n+"は"+c.n+"！ PP+"+g)}const g=Math.min(c.d,99-a.hp);a.hp+=g;render();return ev(a.n+"は"+c.n+"！ HP+"+g)}
 S.inc={a,c,bo};show(a,c,bo,null);await ev(a.n+"の "+c.n+"！",700);
 let t=o;if(a.al==="confusion"){if(Math.random()<.5){t=a;await ev("こんらんして自分を攻撃！",800)}else await ev("なんとか技を出した！",600)}
 if(c.t==="s")a.pp--;
 const d=t!==a?await getDef(t,c,bo):null;
 if(d&&d.b||c.t==="s"&&d&&d.bs){render();return ev(t.n+"は"+(c.t==="s"?"変化技":"攻撃")+"を防いだ！")}
 if(c.t==="s"){render();return apply(t,c.al)}
 let dm=c.d+bo+(Math.random()*5|0)-2;if(a.al==="burn"&&c.k==="p")dm-=10;
 const rr=d?d.ds.reduce((s,x)=>s+(!x.k||x.k===c.k?x.r:0),0):0;dm-=rr;dm=Math.max(rr?0:1,dm);
 t.hp=Math.max(0,t.hp-dm);render();await ev(t.n+"に "+dm+" ダメージ！"+(rr?"（軽減）":""),800);
 if(t.hp>0&&c.al&&Math.random()<c.ch)await apply(t,c.al)}
function end(){const w=S.e.hp<=0,l=S.p.hp<=0;if(!w&&!l)return false;S.over=true;S.mode="idle";render();
 $("mt").textContent=w&&!l?"YOU WIN!":"YOU LOSE";$("mx").textContent=w&&!l?"勝利！ ライバルを倒した！":"敗北…… 次は作戦を変えてみよう。";$("mb").textContent="もう一度";$("md").hidden=false;return true}
async function turnP(pass){
 const P=S.p,E=S.e,idx=[...S.sel],m=main(),bo=idx.map(i=>P.hand[i]).filter(c=>c.t==="b").reduce((s,c)=>s+c.d,0);
 S.mode="idle";S.sel=[];$("pv").innerHTML="";
 P.hand=P.hand.filter((_,i)=>!idx.includes(i));draw(P);render();
 if(pass){if(await can(P))await ev("あなたはカードを捨てて様子を見た");await burn(P)}else await act(P,E,m,bo);
 if(end())return;await ev("相手のターン",600);await turnE()}
async function turnE(){
 const E=S.e,P=S.p,h=E.hand,has=t=>h.filter(c=>c.t===t),sts=has("s").filter(()=>E.pp>0);let c,bo=0;
 const hh=has("h").filter(x=>x.d),pc=has("h").filter(x=>x.pp),cu=has("h").filter(x=>x.cure);if(E.al&&cu.length&&Math.random()<.8)c=cu[0];else if(E.hp<=20&&hh.length&&Math.random()<.7)c=hh.sort((a,b)=>b.d-a.d)[0];
 else if(E.pp<=1&&pc.length&&Math.random()<.6)c=pc[0];
 else if(!P.al&&sts.length&&Math.random()<.25)c=rd(sts);
 else if(has("a").length)c=rd(has("a"));
 else c=hh[0]||pc[0]||sts[0];
 if(!c){const x=rd(h);h.splice(h.indexOf(x),1);draw(E);if(await can(E))await ev("相手はカードを捨てた");await burn(E)}
 else{S.bc=[];h.splice(h.indexOf(c),1);
  if(c.t==="a"){const b=has("b").find(x=>x.k===c.k);if(b){S.bc=[b];bo=b.d;h.splice(h.indexOf(b),1);log("相手は"+b.n+"を重ねた！")}}
  draw(E);await act(E,P,c,bo)}
 if(end())return;await ev("あなたのターン",600);$("pv").innerHTML="";S.mode="atk";render()}
function start(){S={p:mk("あなた"),e:mk("ライバル"),mode:"atk",sel:[],L:[],over:false};draw(S.p);draw(S.e);log("バトル開始！ 手札は常に9枚。");render()}
$("use").onclick=()=>{if(S.mode==="def"){if(S.sel.length)S.wait([...S.sel])}else if(S.mode==="atk"&&main())turnP(false)};
$("pass").onclick=()=>{if(S.mode==="atk"&&S.sel.length===1)turnP(true)};
$("skip").onclick=()=>{if(S.mode==="def")S.wait([])};
$("mb").onclick=()=>{$("md").hidden=true;if(S.over)start()};
$("hb").onclick=()=>{$("mt").textContent="ルール";$("mx").textContent="HP40・PP5で開始（HP・PPの上限は99）、手札は常に9枚（使うと1枚補充）。自分のターンは①カードを使う（攻撃に強化カードを重ねられる）か、②1枚捨てて交代。相手の攻撃・変化技には防御フェイズがあり、防御カード（PP1消費）を重ねがけしてダメージを減らせます。リフレクターは物理技、ひかりのかべは特殊技の威力-10。まもる・みきりは変化技も完全に無効化。みがわり人形は攻撃も変化技も全て無効化（出現率は低め）。変化技・防御カードはPPを1消費。やけど：行動後に2ダメージ＆物理-10／まひ：30%行動不能／こおり：3回行動不能／ねむり：毎回20%で起きる／こんらん：50%で自分を攻撃。";$("mb").textContent="閉じる";$("md").hidden=false};
start();
</script></body></html>
