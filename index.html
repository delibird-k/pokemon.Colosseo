<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Colosseo</title>
<style>
:root{--bg:#55b99b;--pn:#eafff8;--cd:#fff;--ac:#008e74;--tx:#087d6d;--mu:#4f7f7d;--bd:#9fd8cc;--lo:#d9534f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0b2a25;--pn:#123a34;--cd:#1b4d45;--ac:#12a58a;--tx:#d2f7ee;--mu:#93c8bc;--bd:#2f6e63;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:760px;height:100%;margin:auto;display:flex;flex-direction:column;background:var(--pn);position:relative;overflow:hidden}

.fs{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:8px 10px}
.pl{display:flex;align-items:center;gap:10px;width:min(360px,100%);background:#eeecec;color:#4b6574;border:1px solid #aaa;border-radius:20px;padding:5px 14px;cursor:pointer}.pl i{width:12px;height:12px;border-radius:50%;background:#aaa;flex:none}.pl .n{flex:1;font-size:1.05rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.pl.e .n{color:#008d74}.pl.p .n{color:#4b4be0}.pl span{font-size:.7rem;color:#607d88}.pl span b{font-size:1rem;margin-left:3px;color:#4b6574}.pl span b.lo{color:#d9534f}
.pl.tn i{background:#008e74}.pl.tg{box-shadow:0 0 0 3px #e0872f}.pl.dd{opacity:.4}
.fs.many{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}.many .pl{width:auto;flex-wrap:wrap;gap:0 8px;padding:3px 10px}.many .pl .n{flex:1 1 100%;font-size:.85rem}
.tag{color:#fff;background:#e0872f;border-radius:4px;padding:0 5px;font-size:.68rem}.pl .tag{color:#fff}
#pv{margin:0 8px}.bd2{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:96px}.zc{font-size:.7rem;color:var(--mu);margin-bottom:2px}.zn{display:flex;gap:4px;flex-wrap:wrap;min-height:50px}.mc{flex:1 1 70px;max-width:120px;border:1px solid var(--bd);border-left:5px solid var(--c);background:var(--cd);border-radius:6px;padding:3px 5px}.mc b{font-size:.72rem;display:block}.mc small{font-size:.6rem;color:var(--mu)}.pill{margin-top:4px;text-align:center;font-weight:900;font-size:1.2rem;border:3px solid #4a5b57;background:#ddffc8;color:#4a5b57;border-radius:10px;padding:0 8px}
#ph{padding:6px 12px;font-weight:700}
.group-title{grid-column:1/-1;font-weight:800;font-size:.78rem;padding:4px 7px;background:var(--ac);color:#fff;border-radius:5px;margin-top:3px}
#hand{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:6px 8px;align-content:start}
.c{border:1px solid var(--bd);border-top:5px solid var(--c);background:var(--cd);color:var(--tx);border-radius:8px;padding:5px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:80px;align-items:flex-start}
.c b{font-size:.78rem}.c small{font-size:.65rem;color:var(--mu)}.c:disabled{opacity:.4;cursor:default}.c.on{outline:3px solid var(--ac);transform:translateY(-3px)}
.a{--c:#e0872f}.b{--c:#d4b100}.d{--c:#4a7fd1}.h{--c:#3aa86b}.s{--c:#9a5fc9}.m{--c:#c9a227}.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.acts{display:flex;gap:8px;padding:6px 8px;justify-content:center;min-height:46px}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;font:inherit}.btn.pri{background:var(--ac);color:#fff;border:0}.btn:disabled{opacity:.4;cursor:default}.btn.w{display:block;width:100%;margin:8px 0}
.in{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;margin:6px 0;text-align:center;background:var(--cd);color:var(--tx)}
#log{background:var(--ac);color:#fff;padding:5px 12px;height:46px;overflow:hidden;font-size:.8rem}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#6689a8;color:#fff;padding:12px 22px;border-radius:16px;font-weight:800;font-size:1.05rem;display:none;pointer-events:none;text-align:center;max-width:86%;z-index:5}#toast.on{display:block}
.ov{position:absolute;inset:0;background:#063c35aa;display:grid;place-items:center;z-index:9}.md{background:var(--pn);border-radius:14px;padding:22px;width:min(420px,90%);text-align:center;line-height:1.7;max-height:92%;overflow:auto}
#lb{list-style:none;padding:0;margin:6px 0}#lb li{padding:3px 0}
</style></head><body><main>
<header><h1>Pokémon Colosseo</h1><button class="btn" id="hb">ルール</button></header>

<div id="pv"></div><div id="ph"></div>

</div></div>
<div class="ov" id="sh" hidden><div class="md"><h2 id="sht"></h2><p id="shm"></p><div class="sg" id="shg"></div><button class="btn" id="shn">やめる</button></div></div>

</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms)),rd=a=>a[Math.random()*a.length|0],esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const AIL={burn:"やけど",paralysis:"まひ",freeze:"こおり",confusion:"こんらん",sleep:"ねむり"},KL={p:"物理",s:"特殊"};
// t: a=攻撃 b=強化 d=防御 h=回復 s=変化 m=商売  k: p物理 s特殊 any両方  d:威力/回復量  b:完全防御 bs:変化技無効 r:軽減量
const C=[
{id:"tackle",n:"たいあたり",t:"a",k:"p",d:8,x:"安定した物理攻撃"},
{id:"quick",n:"でんこうせっか",t:"a",k:"p",d:6,x:"小ダメージ"},
{id:"flame",n:"ほのおのパンチ",t:"a",k:"p",d:9,al:"burn",ch:.3,x:"30%でやけど"},
{id:"spark",n:"10まんボルト",t:"a",k:"s",d:9,al:"paralysis",ch:.3,x:"30%でまひ"},
{id:"ice",n:"れいとうビーム",t:"a",k:"s",d:8,al:"freeze",ch:.3,x:"30%でこおり"},
{id:"shadow",n:"シャドーボール",t:"a",k:"s",d:10,x:"威力重視"},
{id:"earthquake",n:"じしん",t:"a",k:"p",d:10,all:1,x:"全体攻撃・物理10ダメージ"},
{id:"surf",n:"なみのり",t:"a",k:"s",d:10,all:1,x:"全体攻撃・特殊10ダメージ"},
{id:"sheercold",n:"ぜったいれいど",t:"a",k:"s",d:0,ko:1,ch:.15,all:1,x:"自分以外全員を15%で一撃必殺"},
 {id:"fissure",n:"じわれ",t:"a",k:"p",d:0,ko:1,ch:.15,all:1,x:"自分以外全員を15%で一撃必殺"},
{id:"band",n:"ちからのハチマキ",t:"b",k:"p",d:10,x:"物理技に重ねて+10"},
{id:"glasses",n:"ものしりメガネ",t:"b",k:"s",d:10,x:"特殊技に重ねて+10"},
{id:"orb",n:"いのちのたま",t:"b",k:"any",d:15,life:1,x:"どの技でも+15・自分も5ダメージ"},
{id:"aim",n:"ねらいのまと",t:"b",k:"any",d:0,aim:1,x:"持っている間、相手の技の命中・追加効果が必ず成功"},
{id:"protect",n:"まもる",t:"d",r:10,bs:1,x:"ダメージ-10・変化技無効（PP1）"},
{id:"detect",n:"みきり",t:"d",r:10,bs:1,x:"ダメージ-10・変化技無効（PP1）"},
{id:"sub",n:"みがわり人形",t:"d",r:0,b:1,bs:1,x:"攻撃も変化技も全て無効（PP1）"},
{id:"harden",n:"かたくなる",t:"d",k:"p",r:5,x:"防御+1：物理技-5（PP1）"},
{id:"cotton",n:"コットンガード",t:"d",k:"p",r:15,x:"防御+3：物理技-15（PP1）"},
{id:"amnesia",n:"ドわすれ",t:"d",k:"s",r:10,x:"特防+2：特殊技-10（PP1）"},
{id:"calm",n:"めいそう",t:"d",k:"s",r:5,x:"特防+1：特殊技-5（PP1）"},
{id:"cosmic",n:"コスモパワー",t:"d",r:5,x:"防御・特防+1：どちらも-5（PP1）"},
{id:"light",n:"ひかりのかべ",t:"d",k:"s",r:10,wall:1,x:"攻撃フェイズで使用：3ターン特殊技の被ダメージ-10（PP1）"},
{id:"wall",n:"リフレクター",t:"d",k:"p",r:10,wall:1,x:"攻撃フェイズで使用：3ターン物理技の被ダメージ-10（PP1）"},
{id:"iron",n:"てっぺき",t:"d",k:"p",r:10,x:"防御+2：物理技-10（PP1）"},
{id:"potion",n:"きずぐすり",t:"h",d:5,x:"HP+5"},
{id:"super",n:"いいきずぐすり",t:"h",d:10,x:"HP+10"},
{id:"hyper",n:"すごいきずぐすり",t:"h",d:15,x:"HP+15"},
{id:"pp1",n:"ピーピーエイド",t:"h",pp:1,x:"PP+1"},
{id:"pp2",n:"ピーピーリカバー",t:"h",pp:2,x:"PP+2"},
{id:"pp3",n:"ピーピーエイダー",t:"h",pp:3,x:"PP+3"},
{id:"pp4",n:"ピーピーマックス",t:"h",pp:4,x:"PP+4"},
{id:"oran",n:"オボンの実",t:"h",d:10,x:"HP+10"},
{id:"himeri",n:"ヒメリの実",t:"h",pp:2,x:"PP+2"},
{id:"cure",n:"なんでもなおし",t:"h",cure:1,x:"状態異常を治す"},
{id:"shop",n:"ショップ",t:"m",x:"ランダム4枚から1枚を買う（強化は¥10）"},
{id:"sell",n:"売る",t:"m",x:"手札1枚を相手に売りつける"},
{id:"confuse",n:"あやしいひかり",t:"s",al:"confusion",ch:.75,x:"こんらん（PP1・成功75%）"},
{id:"sleep",n:"さいみんじゅつ",t:"s",al:"sleep",ch:.75,x:"ねむり（PP1・成功75%）"},
{id:"wisp",n:"おにび",t:"s",al:"burn",ch:.75,x:"やけど（PP1・成功75%）"},
{id:"wave",n:"でんじは",t:"s",al:"paralysis",ch:.75,x:"まひ（PP1・成功75%）"}];
C.forEach((c,i)=>c.i=i);
// 32枠の抽選表：攻撃12、通常変化3、回復5、防御7、商売5。
const byType=t=>C.filter(c=>c.t===t);
const PICK_CATEGORIES=[
 ...Array(12).fill("a"),...Array(3).fill("s"),...Array(5).fill("h"),
 ...Array(7).fill("d"),...Array(5).fill("m")
];
const pick=()=>{const group=byType(PICK_CATEGORIES[Math.random()*PICK_CATEGORIES.length|0]);const normal=group.filter(x=>!x.ko);return rd(normal.length&&Math.random()<.9?normal:group).i};
const pr=c=>c.t==="b"?10:5;
const lab=c=>c.t==="a"?KL[c.k]:{b:"強化",d:"防御",h:"回復",s:"変化",m:"商売"}[c.t];
const red=(ds,c)=>ds.reduce((s,x)=>s+(!x.k||x.k===c.k?x.r:0),0);
const comb=ds=>({n:ds.map(x=>x.n).join("＋"),ds,bs:ds.some(x=>x.bs),b:ds.some(x=>x.b)});
const mc=c=>"<div class='mc "+c.t+"'><b>"+c.n+"</b><small>"+c.x+"</small></div>";
function board(c1,a,t1,c2,d,t2){$("pv").innerHTML="<div class='bd2'><div><div class='zc'>"+esc(c1)+"</div><div class='zn'>"+a.map(mc).join("")+"</div>"+(t1?"<div class='pill'>"+t1+"</div>":"")+"</div><div><div class='zc'>"+esc(c2)+"</div><div class='zn'>"+d.map(mc).join("")+"</div>"+(t2?"<div class='pill'>"+t2+"</div>":"")+"</div></div>"}
const draw=p=>{while(p.h.length<9)p.h.push(pick())};
const mk=(n,id,bot)=>({id,n,hp:40,pp:10,mo:20,h:[],al:null,fz:0,bot,d:0,reflect:0,lightScreen:0});
const newGame=P=>{P.forEach(draw);return{P,t:0,ph:"play",ask:null,bd:null,e:null,L:[],w:-1}};
let G=null,MY="",MODE="",R=null,R0=null,host=false,SEQ=0,W=null,CA=null,CPU_COUNT=2;const S={sel:[],tg:-1,n:0,sent:0,es:0};
const DEF={turn:{ps:1,ids:[0],tg:0},def:[],shop:-1,sell:-1};
// ===== 表示 =====
function render(){
 if(!G)return;
 const me=G.P.findIndex(p=>p.id===MY),mp=G.P[me]||{h:[],pp:0,mo:0,n:"観戦"};
 const A=G.ask&&G.ask.to===me&&S.sent!==G.ask.n?G.ask:null;CA=A;
 if(A?A.n!==S.n:S.n){S.n=A?A.n:0;S.sel=[]}
 const ops=G.P.map((p,i)=>i).filter(i=>i!==me&&!G.P[i].d);
 if(ops.length===1)S.tg=ops[0];else if(!ops.includes(S.tg))S.tg=-1;
 const sc=S.sel.map(j=>C[mp.h[j]]).filter(Boolean),M=sc.find(c=>c.t!=="b"),bs=sc.filter(c=>c.t==="b");
 const turn=A&&A.k==="turn",def=A&&A.k==="def",needTg=M&&((M.t==="a"&&!M.all)||(M.t==="s")||M.id==="sell");
 const ok=(c,j)=>{if(!A)return false;if(def)return c.t==="d"&&!c.wall&&(S.sel.includes(j)||mp.pp>S.sel.length);if(!turn||(c.t==="d"&&!c.wall))return false;
  if((c.t==="s"||c.t==="a")&&mp.pp<1)return false;if(c.id==="shop"&&mp.mo<5)return false;if(c.id==="sell"&&mp.h.length<2)return false;
  if(c.t==="b")return !!M&&(M.t==="a"||M.t==="s")&&(c.k==="any"||M.k===c.k);return true};
 $("fs").className="fs"+(G.P.length>3?" many":"");
 $("fs").innerHTML=G.P.map((p,i)=>'<div class="pl '+(i===me?"p":"e")+(i===G.t&&!p.d&&G.ph!=="over"?" tn":"")+(p.d?" dd":"")+(turn&&i===S.tg?" tg":"")+'" data-i="'+i+'"><i></i><b class="n">'+esc(p.n)+'</b>'+(p.al?'<span class="tag">'+AIL[p.al]+'</span>':'')+(p.reflect>0?'<span class="tag">リフレクター '+p.reflect+'</span>':'')+(p.lightScreen>0?'<span class="tag">ひかりのかべ '+p.lightScreen+'</span>':'')+'<span>HP<b class="'+(p.hp<=10?"lo":"")+'">'+p.hp+'</b></span><span>PP<b>'+p.pp+'</b></span><span>¥<b>'+p.mo+'</b></span></div>').join("");
 const hb=$("hand");hb.innerHTML="";
 const groups=[["a","わざカード"],["b","アイテム・強化カード"],["d","防御カード"],["h","回復アイテム"],["s","変化技カード"],["m","商売カード"]];
 groups.forEach(([type,title])=>{const items=mp.h.map((k,j)=>({k,j,c:C[k]})).filter(x=>type==="a"?x.c.t==="a":x.c.t===type);if(!items.length)return;
  const head=document.createElement("div");head.className="group-title";head.textContent=title;hb.appendChild(head);
  items.forEach(({k,j,c})=>{const b=document.createElement("button");b.className="c "+c.t+(S.sel.includes(j)?" on":"");b.disabled=!ok(c,j);
   b.innerHTML="<b>"+c.n+"</b><span class='tag'>"+lab(c)+"</span><small>"+c.x+(c.t==="a"?"（PP1）":"")+"</small>";
   b.onclick=()=>{if(def||c.t==="b")S.sel=S.sel.includes(j)?S.sel.filter(x=>x!==j):[...S.sel,j];else S.sel=S.sel.length===1&&S.sel[0]===j?[]:[j];render()};hb.appendChild(b)})});
 let bd=null;
 if(turn){if(M)bd=[mp.n+"の"+(M.t==="a"?"攻撃":"行動"),[M,...bs],M.t==="a"?"攻"+(M.d+bs.reduce((s,c)=>s+c.d,0)):lab(M),"",[],""]}
 else if(G.bd){const b=G.bd,c=C[b.c],ds=def?sc:b.ds?b.ds.map(i=>C[i]):null;
  bd=[G.P[b.a].n+"の"+(c.t==="a"?"攻撃":"行動"),[c,...b.b.map(i=>C[i])],c.t==="a"?"攻"+(c.d+b.bo):lab(c),ds?G.P[b.tg].n+"の防御":"",ds||[],ds&&ds.length?(ds.some(x=>x.b||c.t==="s"&&x.bs)?"完全防御":c.t==="s"?"無効化できない":"守"+red(ds,c)):""]}
 if(bd)board(...bd);else $("pv").innerHTML="";
 $("use").hidden=!(turn||def);$("pass").hidden=!turn;$("sing").hidden=!(turn&&mp.pp<1);$("skip").hidden=!def;
 $("use").textContent=def?"防御する":"使う";$("sing").disabled=!turn||mp.pp>0;
 $("use").disabled=def?!S.sel.length:!(M&&(!needTg||S.tg>=0));$("pass").disabled=S.sel.length!==1;
 $("ph").textContent=turn?"あなたのターン："+(ops.length>1?"カードを選び、相手の名前をタップして「使う」":"カードを選んで「使う」"):def?"防御フェイズ：防御カードを選び「防御する」":me<0||mp.d?"観戦中…":G.ph==="over"?"":G.P[G.t].n+"の行動中…";
 const ch=A&&(A.k==="shop"||A.k==="sell");$("sh").hidden=!ch;
 if(ch){const sh=A.k==="shop",ids=sh?A.d.o:mp.h;$("sht").textContent=sh?"ショップ":"売る";$("shm").textContent=sh?"所持金 ¥"+mp.mo+"（強化は¥10・他は¥5）":"売るカードを選ぼう（相手が代金を支払う）";
  const g=$("shg");g.innerHTML="";ids.forEach((k,j)=>{const c=C[k],b=document.createElement("button");b.className="c "+c.t;b.innerHTML="<b>"+c.n+"</b><span class='tag'>"+lab(c)+" ¥"+pr(c)+"</span><small>"+c.x+"</small>";b.disabled=sh&&mp.mo<pr(c);b.onclick=()=>send(A,j);g.appendChild(b)});$("shn").onclick=()=>send(A,-1)}
 $("log").innerHTML=G.L.map(x=>"<div>"+esc(x)+"</div>").join("");
 if(G.e&&G.e.s!==S.es){S.es=G.e.s;const o=$("toast");o.textContent=G.e.t;o.classList.add("on");clearTimeout(S.tt);S.tt=setTimeout(()=>o.classList.remove("on"),850)}
 if(G.ph==="over"){$("mt").textContent=G.w===me?"YOU WIN!":me<0?"ゲーム終了":"YOU LOSE";$("mx").textContent=G.w>=0?G.P[G.w].n+" の勝利！":"引き分け";$("mb").textContent="タイトルへ";$("md").hidden=false}
}
function pub(){render();if(R&&host)R.presence({g:G}).catch(()=>{})}
async function ev(t,ms=1100){G.e={s:++SEQ,t};G.L=[...G.L,t].slice(-2);pub();await sl(ms)}
function reply(n,v){if(W&&W.n===n){const r=W.r;W=null;G.ask=null;r(v)}}
function send(a,v){if(host)reply(a.n,v);else{S.sent=a.n;R.presence({cmd:{a:a.n,v}}).catch(()=>{});render()}}
function ask(i,k,d){return new Promise(r=>{const n=++SEQ;G.ask={to:i,k,d,n};W={n,r};if(G.P[i].id!==MY)setTimeout(()=>reply(n,DEF[k]),60000);pub()})}

function bot(p,i){

 const ids=[...new Set((Array.isArray(r.ids)?r.ids:[]).map(Number))].filter(k=>p.h[k]!=null),cs=ids.map(k=>C[p.h[k]]);
 const m=cs.find(c=>c.t!=="b");let T=G.P[r.tg];if(!T||T.d||T===p)T=G.P.find(q=>!q.d&&q!==p);

 chk()}

/* GitHub Pages 用の対人通信。PeerJS のデータ接続を使い、ホストがゲーム状態を管理する。 */
function makeRoomService(){
 const makeGuest=roomId=>new Promise((resolve,reject)=>{
  const peer=new Peer();let done=false,conn=null,local={peer:"",presence:{},sameTab:true},remote={peer:roomId,presence:{},sameTab:false},players={},cb=()=>{},isOpen=false;
  const finishErr=e=>{if(done)return;done=true;try{peer.destroy()}catch(_){}reject(e instanceof Error?e:new Error("部屋に接続できませんでした"))};
  peer.on("error",e=>{if(e.type==="peer-unavailable"||e.type==="network"||e.type==="server-error")finishErr(e)});
  peer.on("open",id=>{local.peer=id;conn=peer.connect(roomId,{reliable:true});conn.on("open",()=>{isOpen=true;done=true;resolve(roomObject())});conn.on("data",msg=>{if(!msg||typeof msg!=="object")return;if(msg.type==="host-state"){remote.presence=msg.host||{};players=msg.players||{};if(msg.g)remote.presence.g=msg.g;cb()}else if(msg.type==="host-presence"){remote.presence=msg.host||{};players=msg.players||{};cb()}});conn.on("close",()=>{finishErr(new Error("ホストとの接続が切れました"))});});
  const roomObject=()=>({
   presence:async data=>{local.presence={...local.presence,...data};if(conn&&conn.open)conn.send({type:"guest-presence",data});return true},
   onPeers:fn=>{cb=fn||(()=>{});if(isOpen)cb()},
   peers:()=>{const arr=[{peer:local.peer,presence:local.presence,sameTab:true}];if(remote.presence)arr.push({peer:roomId,presence:remote.presence,sameTab:false});for(const [id,pres] of Object.entries(players||{})){if(id!==local.peer&&id!==roomId)arr.push({peer:id,presence:pres,sameTab:false})}return arr},
   close:()=>{try{conn&&conn.close();peer.destroy()}catch(_){}}
  });
  setTimeout(()=>{if(!done)finishErr(new Error("部屋が見つかりません。ホストが先に同じ6桁の番号で入室してください。"))},15000);
 });
 const makeHost=roomId=>new Promise((resolve,reject)=>{
  const peer=new Peer(roomId);let done=false,local={peer:roomId,presence:{},sameTab:true},remotes={},connections={},cb=()=>{};
  const roster=()=>Object.fromEntries(Object.entries(remotes).map(([id,p])=>[id,p.presence||{}]));
  const broadcast=()=>{const msg={type:"host-presence",host:local.presence,players:roster()};Object.values(connections).forEach(conn=>{if(conn.open)try{conn.send(msg)}catch(_){}})};
  const onChange=()=>{broadcast();cb()};
  const attach=conn=>{conn.on("data",msg=>{if(!msg||typeof msg!=="object")return;if(msg.type==="guest-presence"){remotes[conn.peer]=remotes[conn.peer]||{peer:conn.peer,presence:{},sameTab:false};remotes[conn.peer].presence={...remotes[conn.peer].presence,...msg.data};onChange()} });conn.on("close",()=>{delete remotes[conn.peer];delete connections[conn.peer];onChange()});};
  peer.on("open",()=>{if(done)return;done=true;resolve(roomObject())});
  peer.on("connection",conn=>{connections[conn.peer]=conn;remotes[conn.peer]={peer:conn.peer,presence:{},sameTab:false};attach(conn);conn.on("open",()=>{try{conn.send({type:"host-presence",host:local.presence,players:roster()})}catch(_){}});onChange()});
  peer.on("error",e=>{if(!done){if(e.type==="unavailable-id"){done=true;try{peer.destroy()}catch(_){}makeGuest(roomId).then(resolve,reject)}else{done=true;reject(e)}}});
  const roomObject=()=>({
   presence:async data=>{local.presence={...local.presence,...data};const msg=data.g?{type:"host-state",host:local.presence,players:roster(),g:data.g}:{type:"host-presence",host:local.presence,players:roster()};Object.values(connections).forEach(conn=>{if(conn.open)try{conn.send(msg)}catch(_){}});return true},
   onPeers:fn=>{cb=fn||(()=>{});cb()},
   peers:()=>[{peer:roomId,presence:local.presence,sameTab:true},...Object.values(remotes)],
   close:()=>{try{peer.destroy()}catch(_){}}
  });
 });
 return {join:roomId=>makeHost(roomId)};
}
